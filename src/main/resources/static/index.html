<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escola - Dashboard</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --panel: #ffffff;
      --panel-alt: #eef4ff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --secondary: #10b981;
      --text: #18212f;
      --muted: #64748b;
      --border: #dfe7f5;
      --shadow: 0 12px 30px rgba(79, 70, 229, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: white;
      border-radius: 24px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.82);
      font-size: 1rem;
    }

    .badge {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 1.15rem;
      color: var(--text);
    }

    form {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #f8faff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: rgba(79, 70, 229, 0.8);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      background: white;
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #6d5efc 100%);
      color: white;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(79, 70, 229, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(79, 70, 229, 0.32);
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--secondary);
      font-weight: 700;
    }

    .list-box {
      background: var(--panel-alt);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      min-height: 180px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    li {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.94rem;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <div>
        <h1>Sistema Escolar</h1>
        <p>Cadastro e visualização de alunos, disciplinas e turmas.</p>
      </div>
      <div class="badge">Painel</div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Cadastrar Aluno</h2>
        <form id="formAluno">
          <input type="text" id="nomeAluno" placeholder="Nome" required />
          <input type="text" id="cpfAluno" placeholder="CPF" required />
          <input type="email" id="emailAluno" placeholder="E-mail" required />
          <input type="text" id="matriculaAluno" placeholder="Matrícula" required />
          <button type="submit">Salvar aluno</button>
        </form>
        <div id="statusAluno" class="status"></div>
      </section>

      <section class="card">
        <h2>Cadastrar Disciplina</h2>
        <form id="formDisciplina">
          <input type="text" id="nomeDisciplina" placeholder="Nome da disciplina" required />
          <input type="number" id="cargaHoraria" placeholder="Carga horária" min="1" required />
          <button type="submit">Salvar disciplina</button>
        </form>
        <div id="statusDisciplina" class="status"></div>
      </section>

      <section class="card">
        <h2>Cadastrar Turma</h2>
        <form id="formTurma">
          <input type="text" id="nomeTurma" placeholder="Nome da turma" required />
          <input type="number" id="anoTurma" placeholder="Ano" min="2000" required />
          <input type="text" id="disciplinaTurma" placeholder="Disciplina vinculada" required />
          <button type="submit">Salvar turma</button>
        </form>
        <div id="statusTurma" class="status"></div>
      </section>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Alunos</h2>
        <div class="list-box">
          <ul id="listaAlunos"></ul>
        </div>
      </section>

      <section class="card">
        <h2>Disciplinas</h2>
        <div class="list-box">
          <ul id="listaDisciplinas"></ul>
        </div>
      </section>

      <section class="card">
        <h2>Turmas</h2>
        <div class="list-box">
          <ul id="listaTurmas"></ul>
        </div>
      </section>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
